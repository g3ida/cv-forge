[package]
name = "cvforge-py"
description = "cv-forge for Python: the module auto-apply loads in place of cv-builder"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lib]
name = "_cvforge"
crate-type = ["cdylib"]

[dependencies]
cvforge.workspace = true
pyo3 = { version = "0.30", features = ["abi3-py39"] }

[features]
extension-module = ["pyo3/extension-module"]

[lints]
workspace = true
