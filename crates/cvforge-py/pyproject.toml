[build-system]
requires = ["maturin>=1.9,<2"]
build-backend = "maturin"

[project]
name = "cvforge"
version = "0.1.0"
description = "Fast PDF CVs from JSON Resume files: cv-builder's engine in Rust, with Typst"
requires-python = ">=3.9"
license = { text = "MIT" }

[tool.maturin]
python-source = "python"
module-name = "cvforge._cvforge"
profile = "release-py"
features = ["extension-module"]
