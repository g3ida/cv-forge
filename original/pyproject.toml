[project]
name = "cv-builder"
version = "0.1.0"
description = "Build a PDF CV from a standardized (JSON Resume compatible) JSON file"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "pydantic>=2.7",
  "jinja2>=3.1",
  "weasyprint>=62",
]

[dependency-groups]
dev = ["pytest>=8", "pypdf>=4"]

[project.scripts]
cv-builder = "cv_builder.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cv_builder"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
