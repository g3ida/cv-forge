[package]
name = "cvforge-units"
version = "0.1.0"
edition = "2024"
rust-version = "1.92"
publish = false
description = "Rust port of `src/cv_builder/`, generated by rust-anything"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
cvforge = { path = "../../crates/cvforge" }
pyo3 = { version = "0.30", features = ["extension-module", "abi3-py39"] }
serde = "1"
serde_json = { version = "1", features = ["preserve_order", "float_roundtrip", "unbounded_depth"] }

[profile.release]
lto = true

[lints.clippy]
all = { level = "warn", priority = -1 }

[lints.rust]
unused_lifetimes = "warn"
trivial_numeric_casts = "warn"
